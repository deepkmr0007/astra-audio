# ASTRA Audio–Text CI
#  build     – unit tests, debug + optimized release APK, native-library checks
#  bench     – REAL Whisper models on the Linux runner: accuracy (WER/CER) and speed, silence-skip speed-up
#  emulator  – instrumented tests on an Android emulator, incl. real on-device speech recognition
#  release   – on main: publishes the optimized APK + benchmark results as a GitHub Release
name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # diagnostics are attached to a DRAFT (non-public) release; final APKs to a public release

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ASTRA_BUILD_NUMBER: ${{ github.run_number }}
  HF: https://huggingface.co/ggerganov/whisper.cpp/resolve/main
  JFK: https://raw.githubusercontent.com/ggml-org/whisper.cpp/d1be6fde11ac6e0407606b4e42fe72d34add8037/samples/jfk.wav
  JFK_TEXT: "And so my fellow Americans, ask not what your country can do for you, ask what you can do for your country."

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Install NDK and CMake
        run: |
          for i in 1 2 3; do
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0" > /dev/null && break
            echo "sdkmanager attempt $i failed, retrying"; sleep 20
          done
          test -d "$ANDROID_HOME/ndk/27.2.12479018"
      - name: Check string resources (English + Hindi)
        run: python3 scripts/gen_strings.py && git diff --exit-code app/src/main/res/values app/src/main/res/values-hi
      - name: Unit tests
        run: |
          set -o pipefail; mkdir -p ci-logs
          ./gradlew --no-daemon --stacktrace test 2>&1 | tee ci-logs/unit-tests.log
      - name: Report unit-test failures
        if: failure()
        run: |
          for f in $(grep -l "<failure" $(find . -path '*/test-results/*' -name '*.xml') 2>/dev/null); do
            python3 - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          for tc in ET.parse(sys.argv[1]).getroot().iter('testcase'):
              for fl in tc.findall('failure'):
                  msg=(fl.get('message') or fl.text or '')[:400].replace('\n',' ')
                  print(f"::error title=Unit test failed::{tc.get('classname')}.{tc.get('name')}: {msg}")
          PY
          done
      - name: Build APKs (debug + optimized release)
        run: |
          set -o pipefail; mkdir -p ci-logs
          ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:assembleRelease 2>&1 | tee ci-logs/build.log
      - name: Check native libraries
        run: |
          set -e
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          rm -rf /tmp/apk && mkdir -p /tmp/apk && unzip -q -o "$APK" 'lib/*' -d /tmp/apk
          NM="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          RE="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          echo "::notice title=Native libraries (arm64)::$(cd /tmp/apk/lib/arm64-v8a && ls | tr '\n' ' ')"
          ls /tmp/apk/lib/arm64-v8a/libggml-cpu-android_armv8.2_2.so > /dev/null || { echo "::error::runtime CPU variants missing from APK"; exit 1; }
          for so in /tmp/apk/lib/*/*.so; do
            if "$NM" -D --undefined-only "$so" | grep -E ' (socket|connect|getaddrinfo|gethostbyname|curl_)'; then
              echo "::error::$so references networking symbols"; exit 1
            fi
            case "$so" in *armeabi-v7a*|*/x86/*) continue;; esac   # 16 KB pages only exist on 64-bit devices
            if "$RE" -lW "$so" | awk '$1=="LOAD"{print $NF}' | grep -qv '0x4000'; then
              echo "::warning::$so is not 16 KB page aligned"
            fi
          done
          echo "::notice title=APK sizes::$(du -h app/build/outputs/apk/*/*.apk | tr '\n' ' ')"
      - name: Lint
        run: ./gradlew --no-daemon :app:lintDebug
        continue-on-error: true
      - name: Collect APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/ASTRA-AudioText-v1.1-build${{ github.run_number }}.apk"
          cp app/build/outputs/apk/debug/*.apk "out/ASTRA-AudioText-v1.1-build${{ github.run_number }}-debug.apk"
          (cd out && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: out/ }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-reports
          path: |
            **/build/reports/
            **/build/test-results/
      - name: Upload diagnostics
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: bash .github/scripts/diagnostics.sh build ci-logs $(find . -path '*/test-results/*' -name '*.xml' 2>/dev/null | head -50)

  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Download real models + sample and verify checksums
        run: |
          set -e
          mkdir -p /tmp/models && cd /tmp/models
          curl -sSfL --retry 4 --retry-delay 5 -o ggml-tiny.en.bin "$HF/ggml-tiny.en.bin"
          curl -sSfL --retry 4 --retry-delay 5 -o ggml-base.en.bin "$HF/ggml-base.en.bin"
          curl -sSfL --retry 4 --retry-delay 5 -o ggml-base.bin    "$HF/ggml-base.bin"
          curl -sSfL --retry 4 --retry-delay 5 -o jfk.wav "$JFK"
          printf '%s  %s\n' c78c86eb1a8faa21b369bcd33207cc90d64ae9df ggml-tiny.en.bin 137c40403d78fd54d454da0f9bd998f78703390c ggml-base.en.bin 465707469ff3a37a2b9b8d8f89f2f99de7299dac ggml-base.bin | sha1sum -c -
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the native library for this runner
        run: |
          cmake -S engine-whisper/src/main/cpp -B build/native-host -DCMAKE_BUILD_TYPE=Release -DASTRA_CPU_VARIANTS=ON > /dev/null
          cmake --build build/native-host --target astra_whisper -j4 > /dev/null
          ls build/native-host build/native-host/bin
      - name: Benchmark (accuracy + speed on this runner's CPU)
        env:
          ASTRA_NATIVE_DIR: build/native-host
          ASTRA_BACKEND_DIR: build/native-host/bin
          LD_LIBRARY_PATH: ${{ github.workspace }}/build/native-host/bin
          ASTRA_THREADS: "4"
        run: |
          ./gradlew --no-daemon -q :tools:bench:installDist
          : > bench.txt
          for m in tiny.en base.en base; do
            echo "== ggml-$m.bin" | tee -a bench.txt
            ASTRA_REFERENCE="$JFK_TEXT" ./gradlew --no-daemon -q :tools:bench:run --args="/tmp/models/ggml-$m.bin /tmp/models/jfk.wav" > bench-$m.log 2>&1 || { tail -60 bench-$m.log; exit 1; }
            grep -E "^(backend|engine|BENCH)" bench-$m.log | sed "s/^/[$m] /" | tee -a bench.txt
          done
          grep BENCH bench.txt | while IFS= read -r l; do echo "::notice title=Benchmark::$l"; done
          ! grep -E "WER=0\.[3-9]|WER=[1-9]" bench.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: bench, path: bench.txt }
      - name: Upload diagnostics
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: bash .github/scripts/diagnostics.sh bench bench.txt bench-*.log

  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Install NDK and CMake
        run: |
          for i in 1 2 3; do
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null && break
            echo "sdkmanager attempt $i failed, retrying"; sleep 20
          done
          test -d "$ANDROID_HOME/ndk/27.2.12479018"
      - name: Bundle a real model for the on-device speech test
        run: |
          set -e
          mkdir -p app/src/androidTest/assets
          curl -sSfL --retry 4 --retry-delay 5 -o app/src/androidTest/assets/ggml-tiny.en.bin "$HF/ggml-tiny.en.bin"
          curl -sSfL --retry 4 --retry-delay 5 -o app/src/androidTest/assets/jfk.wav "$JFK"
          echo "c78c86eb1a8faa21b369bcd33207cc90d64ae9df  app/src/androidTest/assets/ggml-tiny.en.bin" | sha1sum -c -
      - name: Instrumented tests on Android 14 emulator (x86_64)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: |
            adb logcat -c || true
            ./gradlew --no-daemon :app:connectedDebugAndroidTest > gradle-connected.log 2>&1 || (adb logcat -d > emulator-log.txt; exit 1)
            adb logcat -d > emulator-log.txt || true
      - name: Report emulator results
        if: always()
        shell: bash {0}   # reporting must never fail the job by itself
        run: |
          grep -h "ASTRA-BENCH" emulator-log.txt 2>/dev/null | sed 's/^.*ASTRA-BENCH: //' | while IFS= read -r l; do echo "::notice title=On-device (emulator) benchmark::$l"; done
          if grep -q "FATAL EXCEPTION" emulator-log.txt 2>/dev/null; then
            echo "::error title=Crash on emulator::$(grep -h 'FATAL EXCEPTION' -A6 emulator-log.txt | tr '\n' ' ' | head -c 1500)"
          fi
          for f in $(find app/build/outputs/androidTest-results -name '*.xml' 2>/dev/null); do
            python3 - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          r=ET.parse(sys.argv[1]).getroot()
          for tc in r.iter('testcase'):
              for fl in tc.findall('failure'):
                  msg=(fl.get('message') or fl.text or '')[:600].replace('\n',' ')
                  print(f"::error title=Instrumented test failed::{tc.get('classname')}.{tc.get('name')}: {msg}")
          print(f"::notice title=Instrumented tests::{r.get('tests')} tests, {r.get('failures')} failures, {r.get('skipped')} skipped ({sys.argv[1].split('/')[-1]})")
          PY
          done
          exit 0
      - name: Upload diagnostics
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: bash .github/scripts/diagnostics.sh emulator emulator-log.txt gradle-connected.log app/build/outputs/androidTest-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator
          path: |
            emulator-log.txt
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/

  release:
    needs: [build, bench, emulator]
    if: always() && needs.build.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: apk, path: out }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: bench, path: bench }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: emulator, path: emu }
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "**Install:** download \`ASTRA-AudioText-v1.1-build${{ github.run_number }}.apk\` on your phone and open it (allow installs from your browser/file manager). Android 8.0+."
            echo
            echo "Optimized release build, signed with the repository's public debug key (newer builds install over older ones). The \`-debug\` APK is for testing."
            echo
            echo "Checks in this run: unit tests ✅ · on-device emulator tests: ${{ needs.emulator.result }} · real-model benchmark: ${{ needs.bench.result }}"
            echo
            if [ -f bench/bench.txt ]; then echo '**Benchmark on the CI runner CPU (x86, 4 threads — phone numbers differ):**'; echo '```'; grep BENCH bench/bench.txt | sed 's/ text=.*//'; echo '```'; fi
            if [ -f emu/emulator-log.txt ] && grep -q ASTRA-BENCH emu/emulator-log.txt; then
              echo; echo '**On-device speech recognition test (Android 14 emulator, x86-64, 2 cores, real tiny.en model):**'; echo '```'
              grep -h ASTRA-BENCH emu/emulator-log.txt | sed 's/^.*ASTRA-BENCH: //; s/ text=.*//'; echo '```'
            fi
            echo
            echo "SHA-256 checksums are in SHA256SUMS.txt. Commit: ${{ github.sha }}"
          } > notes.md
          gh release create "build-${{ github.run_number }}" out/* \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "ASTRA Audio–Text v1.1 — build ${{ github.run_number }}" \
            --notes-file notes.md --latest
